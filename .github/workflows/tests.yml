name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build tools
      run: python -m pip install --upgrade build twine

    - name: Build source distribution and wheel
      run: python -m build --outdir .ci-dist

    - name: Validate package metadata
      run: python -m twine check .ci-dist/*

    - name: Install wheel and verify package version
      run: |
        python -m pip install --force-reinstall .ci-dist/*.whl
        python -c "import neuralnode; assert neuralnode.__version__ == '2.2.8'; print(neuralnode.__version__)"

  test:
    # Python 3.9 is no longer available on the newest Ubuntu runner image.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest tests/ -v --cov=src/neuralnode --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black ruff mypy

    - name: Check formatting with black
      run: black --check src/neuralnode

    # The legacy tree has broad style/type debt; keep CI focused on undefined
    # names while that debt is addressed incrementally.
    - name: Check undefined names with ruff
      run: ruff check src/neuralnode --select F821

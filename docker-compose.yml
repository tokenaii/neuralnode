version: '3.8'

services:
  neuralnode:
    build: .
    container_name: neuralnode
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - NEURALNODE_LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    ports:
      - "8000:8000"
    networks:
      - neuralnode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import neuralnode"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: ChromaDB for RAG
  chromadb:
    image: chromadb/chroma:latest
    container_name: neuralnode-chromadb
    volumes:
      - chroma-data:/chroma/chroma
    ports:
      - "8001:8000"
    networks:
      - neuralnode-network
    restart: unless-stopped

  # Optional: Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: neuralnode-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - neuralnode-network
    restart: unless-stopped

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: neuralnode-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    networks:
      - neuralnode-network
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  chroma-data:
  prometheus-data:
  grafana-data:

networks:
  neuralnode-network:
    driver: bridge

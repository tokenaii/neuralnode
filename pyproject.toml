[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuralnode"
version = "2.2.8"
description = "Connect models. Build AI. A Python framework for LLM providers, agents, memory, RAG, and tools."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
keywords = ["llm", "ai", "agent", "framework", "openai", "anthropic", "google", "ollama", "langchain", "rag", "tools", "automation", "embeddings", "vector-stores"]
authors = [
    {name = "Assem Sabry", email = "assemsabryy@outlook.com"}
]
maintainers = [
    {name = "Assem Sabry", email = "assemsabryy@outlook.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "requests>=2.28.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# LLM Providers
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.8.0"]
google = ["google-generativeai>=0.3.0", "google-cloud-aiplatform>=1.38.0"]
azure = ["openai>=1.0.0"]
cohere = ["cohere>=4.0.0"]
mistral = ["mistralai>=0.0.12"]
groq = ["groq>=0.4.0"]
aws = ["boto3>=1.34.0"]

# Local Models
ollama = ["ollama>=0.1.0"]
local = [
    "llama-cpp-python>=0.2.0",
    "huggingface_hub>=0.23.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    "gguf",
]
image = [
    "torch>=2.0.0",
    "diffusers>=0.30.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "pillow>=10.0.0",
]
vision = ["Pillow>=9.0"]

# Horus Models (Custom AI Models by TokenAII)
# Complete setup with all transformers features
horus = [
    "llama-cpp-python>=0.2.0",
    "huggingface_hub>=0.23.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "diffusers>=0.30.0",
    "accelerate>=0.24.0",
    "bitsandbytes>=0.41.0",        # 4-bit/8-bit quantization
    "sentencepiece>=0.1.99",        # Tokenization
    "protobuf>=3.20.0",             # Model serialization
    "scipy>=1.10.0",                # Math operations
    "einops>=0.7.0",                # Tensor operations
    "pillow>=10.0.0",               # Image output
    "gguf",
]

# Flash Attention (Windows requires special install)
# pip install flash-attn --no-build-isolation
flash-attn = ["flash-attn>=2.3.0"]

# All Local Models (comprehensive)
local-all = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "bitsandbytes>=0.41.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    "scipy>=1.10.0",
    "einops>=0.7.0",
    "llama-cpp-python>=0.2.0",
    "huggingface_hub>=0.23.0",
    "gguf",
]

# Embeddings
embeddings = [
    "sentence-transformers>=2.2.0",
    "tiktoken>=0.5.0",
    "InstructorEmbedding>=1.0.1",
    "fastembed>=0.1.0",
]

# Vector Stores
chroma = ["chromadb>=0.4.0"]
faiss = ["faiss-cpu>=1.7.4"]
pinecone = ["pinecone-client>=2.2.0"]
qdrant = ["qdrant-client>=1.6.0"]
weaviate = ["weaviate-client>=3.0.0"]
milvus = ["pymilvus>=2.3.0"]
redis = ["redis>=5.0.0"]

# RAG & Documents
rag = [
    "pypdf>=3.17.0",
    "python-docx>=0.8.11",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.5.0",
]

speech = [
    "SpeechRecognition>=3.10.0",
    "pydub>=0.25.1",
]
hf-audio = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "soundfile>=0.12.0",
    "scipy>=1.11.0",
]

replica = [
    "edge-tts>=6.1.0",
]

# TurboQuant (built-in, no external dependency needed)
turboquant = []

# Tools
tools = [
    "serpapi>=0.1.0",
    "wikipedia>=1.4.0",
    "sqlalchemy>=2.0.0",
    "pymongo>=4.6.0",
    "psutil>=5.9.0",
]

# Integrations
telegram = [
    "python-telegram-bot>=20.0",
    "SpeechRecognition>=3.10.0",
    "pydub>=0.25.1",
    "edge-tts>=6.1.0",
    "pypdf>=3.17.0",
    "python-docx>=0.8.11",
]
discord = ["discord.py>=2.3.0"]
slack = ["slack-sdk>=3.21.0"]
openclaw = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

# All features
all = [
    "openai>=1.0.0",
    "anthropic>=0.8.0",
    "google-generativeai>=0.3.0",
    "cohere>=4.0.0",
    "mistralai>=0.0.12",
    "groq>=0.4.0",
    "ollama>=0.1.0",
    "chromadb>=0.4.0",
    "faiss-cpu>=1.7.4",
    "llama-cpp-python>=0.2.0",
    "huggingface_hub>=0.23.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "bitsandbytes>=0.41.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    "scipy>=1.10.0",
    "einops>=0.7.0",
    "sentence-transformers>=2.2.0",
    "python-telegram-bot>=20.0",
    "twilio>=9.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "edge-tts>=6.1.0",
    "SpeechRecognition>=3.10.0",
    "pydub>=0.25.1",
    "pypdf>=3.17.0",
    "python-docx>=0.8.11",
    "beautifulsoup4>=4.12.0",
    "sqlalchemy>=2.0.0",
    "psutil>=5.9.0",
    "gguf",
]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://tokenai.llc/"
NeuralNode = "https://tokenai.llc/"
Documentation = "https://neuralnode.readthedocs.io"
Repository = "https://github.com/tokenaillc/neuralnode"
Issues = "https://github.com/tokenaillc/neuralnode/issues"
Changelog = "https://github.com/tokenaillc/neuralnode/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/neuralnode"]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.pytest_cache",
    "/.tmp_build",
    "/.tmp_*",
    "/actionlint.zip",
    "/actionlint_bin",
    "/dist",
    "/dist_*",
    "/outputs",
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
